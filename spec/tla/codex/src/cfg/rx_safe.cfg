\* rx_safe: Codex events: the working hold's safety, subagent, two turns, every switch (b.36h's cond_safe under Codex)
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 2
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {"HookDeath", "BothEndsDie", "SlowIdle", "Claim"}
  Probe = ""
