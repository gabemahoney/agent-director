\* rx_lim_rowsettles: documented difference: Claude's RowSettles under Codex events fails (no automatic repair of a row left working)
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
