\* red_samerestart: inv 2: a same-value hook write restarts the clock
\* Expected: FAIL(Invariant_SettledIsSpec_is_violated)
SPECIFICATION Spec
CONSTANTS
  NHooks = 2
  MaxT = 2
  InitT = 2
  MaxCfgChanges = 0
  MaxTime = 4
  MaxWrites = 3
  InitStates = {"waiting", "working"}
  FreshInsert = FALSE
  HookVals = {"waiting", "working", "check_permission", "ended"}
  HookFromTerminal = TRUE
  Commands = TRUE
  Guards = TRUE
  ReadClock = "inline"
  Mut = "samerestart"
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ZeroIsRaw
INVARIANT ImmediateAtOnce
INVARIANT GuardsReadRaw
INVARIANT NeverUnsupported
INVARIANT SettledIsSpec
