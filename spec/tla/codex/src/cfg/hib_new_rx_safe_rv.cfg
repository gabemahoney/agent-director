\* b.hib: one finite different-id NON-COMPACT boundary; all original coverage retained.
\* rx_safe_rv: Q2 gate: rx_safe + CxReview: the review's unmarked working writes keep WorkingTrue and NoStaleHold
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  HibRelax <- KnobOn
  HibKeepIdle <- KnobOn
  HibPreserveEligible <- KnobOff
  MaxTurns = 2
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {"HookDeath", "BothEndsDie", "SlowIdle", "Claim"}
  Probe = ""
  CxRelay <- KnobOn
  CxReview <- KnobOn
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT WorkingTrue
INVARIANT NoStaleHold

PROPERTY HibActivePreserved
PROPERTY HibNoIdleStamp
PROPERTY HibNewSessionWaits
