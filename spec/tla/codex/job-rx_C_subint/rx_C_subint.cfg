\* rx_C_subint: control: a subagent's Interrupt is unmarked and read as the main turn end: plain keys reach the main agent's shown dialog
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 1
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {"LastGasp"}
  Probe = ""
  CxRelay <- KnobOn
  CxSubIntUnmarked <- KnobOn
CHECK_DEADLOCK FALSE
INVARIANT KeysSafe
