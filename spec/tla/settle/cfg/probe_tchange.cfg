\* probe_tchange: probe: T changes between a hook write and a read
\* Expected: FAIL(Invariant_ProbeTChangeRead_is_violated)
SPECIFICATION Spec
CONSTANTS
  NHooks = 2
  MaxT = 2
  InitT = 2
  MaxCfgChanges = 1
  MaxTime = 4
  MaxWrites = 3
  InitStates = {"waiting", "working"}
  FreshInsert = FALSE
  HookVals = {"waiting", "working", "check_permission", "ended"}
  HookFromTerminal = TRUE
  Commands = TRUE
  Guards = TRUE
  ReadClock = "inline"
  Mut = "none"
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ProbeTChangeRead
