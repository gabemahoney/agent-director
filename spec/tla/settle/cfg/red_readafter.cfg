\* red_readafter: inv 2 (reads): the reader reads the row, then takes its clock
\* Expected: FAIL(Invariant_ReadsLinearizable_is_violated)
SPECIFICATION Spec
CONSTANTS
  NHooks = 2
  MaxT = 2
  InitT = 2
  MaxCfgChanges = 0
  MaxTime = 4
  MaxWrites = 3
  InitStates = {"waiting", "working"}
  FreshInsert = FALSE
  HookVals = {"waiting", "working", "check_permission", "ended"}
  HookFromTerminal = TRUE
  Commands = TRUE
  Guards = TRUE
  ReadClock = "after"
  Mut = "none"
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ZeroIsRaw
INVARIANT SettledIsSpec
INVARIANT HeldOrLastSettled
INVARIANT ImmediateAtOnce
INVARIANT GuardsReadRaw
INVARIANT NeverUnsupported
INVARIANT ReadsLinearizable
