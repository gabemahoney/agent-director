\* ci_H_Sns: as ci_H_S with an unreadable pane start time (pid alone decides), no pid reuse (unbounded processes: MaxClock 4)
SPECIFICATION Spec
CONSTANTS
  MaxClock = 4
  MaxLife = 2
  MaxFaults = 1
  PidPool = 0
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = TRUE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
INVARIANT RowOnlyByAgent KillAllGone ClockBound
CHECK_DEADLOCK FALSE
