\* probe_flap: probe: A -> B -> A within T is reached and a read returns A
\* Expected: FAIL(Invariant_ProbeFlap_is_violated)
SPECIFICATION Spec
CONSTANTS
  NHooks = 2
  MaxT = 2
  InitT = 2
  MaxCfgChanges = 0
  MaxTime = 4
  MaxWrites = 3
  InitStates = {"waiting", "working"}
  FreshInsert = FALSE
  HookVals = {"waiting", "working", "check_permission", "ended"}
  HookFromTerminal = TRUE
  Commands = TRUE
  Guards = TRUE
  ReadClock = "inline"
  Mut = "none"
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ProbeFlap
