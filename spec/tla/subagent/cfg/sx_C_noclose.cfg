\* sx_C_noclose: control: ended, missing and a new launch close nothing; a record stays running
\* b.xjn (spec/tla/subagent/README.md). Phase5Hook design values; b.xjn knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxClock = 4
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Sub <- KnobOn
  SubNoClose <- KnobOn
INVARIANT SubNoStaleRunning
CHECK_DEADLOCK FALSE
