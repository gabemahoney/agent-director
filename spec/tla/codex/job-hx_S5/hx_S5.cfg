\* hx_S5: Codex rule + pause (fix): as hx_S with pid reuse and readable start (MaxClock 5, PidPool 3)
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). Phase5Hook design values; b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxClock = 5
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Codex <- KnobOn
  PauseOn <- KnobOn
  PauseSeesGone <- KnobOn
INVARIANT RowOnlyByAgent KillAllGone ClockBound CxNoEndedWhileAlive
CHECK_DEADLOCK FALSE
