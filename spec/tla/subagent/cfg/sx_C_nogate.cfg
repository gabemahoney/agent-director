\* sx_C_nogate: control: the record write is not gated; a nested claude or a stray writes a record
\* b.xjn (spec/tla/subagent/README.md). Phase5Hook design values; b.xjn knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxClock = 4
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Sub <- KnobOn
  SubNoGate <- KnobOn
INVARIANT SubOnlyByAgent
CHECK_DEADLOCK FALSE
