\* ci_H_Cadopt: control: a lost reply adopts any pane of the labelled session
SPECIFICATION Spec
CONSTANTS
  MaxClock = 7
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "anypane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
INVARIANT RowOnlyByAgent KillAllGone ClockBound
CHECK_DEADLOCK FALSE
