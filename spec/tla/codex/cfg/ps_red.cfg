\* b.y7g: busy Codex pause; bounds and coverage in ../README.md.
SPECIFICATION PauseSignalSpec
CONSTANTS
  MaxClock = 3
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = FALSE
  AllowLeftover = FALSE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = FALSE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Codex <- KnobOn
  PauseOn <- KnobOn
  PauseSeesGone <- KnobOn
  BusyPauseOn <- KnobOn
  \* Even fair recovery cannot end a live looping agent.
  PauseSpec <- FairSpecP
INVARIANTS RowOnlyByAgent KillAllGone ClockBound CxNoEndedWhileAlive SignalOnlyLaunch PauseKeysSafe
PROPERTY BusyPauseResolves
CHECK_DEADLOCK FALSE
