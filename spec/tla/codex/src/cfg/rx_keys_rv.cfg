\* rx_keys_rv: Q2 gate: rx_keys + CxReview, with the last-gasp window: KeysSafe and NoStaleHold
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 2
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {"HookDeath", "BothEndsDie", "Claim", "LastGasp"}
  Probe = ""
  CxRelay <- KnobOn
  CxReview <- KnobOn
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT KeysSafe
INVARIANT NoStaleHold
