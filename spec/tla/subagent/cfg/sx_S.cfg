\* sx_S: subagent records: gate safety and no stale running record, whole world, unreadable start (ci_H_Sns bounds)
\* b.xjn (spec/tla/subagent/README.md). Phase5Hook design values; b.xjn knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxClock = 4
  MaxLife = 2
  MaxFaults = 1
  PidPool = 0
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = TRUE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Sub <- KnobOn
INVARIANT RowOnlyByAgent KillAllGone ClockBound SubOnlyByAgent SubNoStaleRunning
CHECK_DEADLOCK FALSE
