\* rx_V_subheld: probe: a subagent's request allowed through the relay still holds plain send-keys at rest (until the agent ends)
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 1
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {}
  Probe = ""
  CxRelay <- KnobOn
CHECK_DEADLOCK FALSE
INVARIANT NeverSubAllowHeld
