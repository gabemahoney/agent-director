\* hx_C_endnow: control: a Codex SessionEnd ends the row at once (Claude's rule): /new ends a row whose agent goes on running
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). Phase5Hook design values; b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxClock = 4
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Codex <- KnobOn
  CxEndNow <- KnobOn
INVARIANT CxNoEndedWhileRunning
CHECK_DEADLOCK FALSE
