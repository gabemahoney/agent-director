\* sanity: the local check (not a job). The design at a constant T = 2, small bounds
\* (MaxTime 3, MaxWrites 3), every invariant. Expected: PASS.
SPECIFICATION Spec
CONSTANTS
  NHooks = 2
  MaxT = 2
  InitT = 2
  MaxCfgChanges = 0
  MaxTime = 3
  MaxWrites = 3
  InitStates = {"waiting", "working"}
  FreshInsert = FALSE
  HookVals = {"waiting", "working", "check_permission", "ended"}
  HookFromTerminal = TRUE
  Commands = TRUE
  Guards = TRUE
  ReadClock = "inline"
  Mut = "none"
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ZeroIsRaw
INVARIANT SettledIsSpec
INVARIANT HeldOrLastSettled
INVARIANT ReadsLinearizable
INVARIANT ImmediateAtOnce
INVARIANT GuardsReadRaw
INVARIANT NeverUnsupported
INVARIANT WellDefined
INVARIANT BeeFormReaderT
