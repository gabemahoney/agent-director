\* probe_cmdcuts: probe: a command write lands while a hook change is unsettled
\* Expected: FAIL(Invariant_ProbeCmdCutsSettle_is_violated)
SPECIFICATION Spec
CONSTANTS
  NHooks = 2
  MaxT = 2
  InitT = 2
  MaxCfgChanges = 0
  MaxTime = 4
  MaxWrites = 3
  InitStates = {"waiting", "working"}
  FreshInsert = FALSE
  HookVals = {"waiting", "working", "check_permission", "ended"}
  HookFromTerminal = TRUE
  Commands = TRUE
  Guards = TRUE
  ReadClock = "inline"
  Mut = "none"
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ProbeCmdCutsSettle
