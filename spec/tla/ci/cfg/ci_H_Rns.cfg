\* ci_H_Rns: residual: unreadable start time + pid reuse (the agent dies before its first hook and another Claude gets its pid)
SPECIFICATION Spec
CONSTANTS
  MaxClock = 7
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = TRUE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
INVARIANT RowOnlyByAgent KillAllGone ClockBound
CHECK_DEADLOCK FALSE
