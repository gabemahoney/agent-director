\* sx_S5: subagent records: as sx_S with pid reuse and readable start times (MaxClock 5, PidPool 3)
\* b.xjn (spec/tla/subagent/README.md). Phase5Hook design values; b.xjn knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxClock = 5
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Sub <- KnobOn
INVARIANT RowOnlyByAgent KillAllGone ClockBound SubOnlyByAgent SubNoStaleRunning
CHECK_DEADLOCK FALSE
