\* hx_C_pause: control = the brief as written: pause's wait only polls the state, find-missing not scheduled: the row stays waiting
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). Phase5Hook design values; b.ssz knobs at the end of CONSTANTS.
SPECIFICATION PauseSpec
CONSTANTS
  MaxClock = 4
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = FALSE
  AllowLeftover = FALSE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = FALSE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Codex <- KnobOn
  PauseOn <- KnobOn
PROPERTY PauseSeesEnd
CHECK_DEADLOCK FALSE
