\* rx_V_review: Q2 gate probe: a review write leaves the row working at rest (must be reached)
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 1
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {}
  Probe = "review"
  CxRelay <- KnobOn
  CxReview <- KnobOn
CHECK_DEADLOCK FALSE
INVARIANT NeverHit
