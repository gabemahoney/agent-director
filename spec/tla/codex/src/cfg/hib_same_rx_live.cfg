\* b.hib: one finite eligible commit: same id (any source), or compact (either id); all original coverage retained.
\* rx_live: Codex events: every property, RowSettles restated (RowSettlesCx) and the hold settles (KeysSettle), subagent, two turns
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  HibRelax <- KnobOn
  HibKeepIdle <- KnobOn
  MaxTurns = 2
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {"HookDeath", "Claim"}
  Probe = ""
  CxRelay <- KnobOn
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT WorkingTrue
INVARIANT NoStaleHold
PROPERTY RowSettlesCx
PROPERTY KeysSettle

PROPERTY HibActivePreserved
PROPERTY HibNoIdleStamp
PROPERTY HibNewSessionWaits
