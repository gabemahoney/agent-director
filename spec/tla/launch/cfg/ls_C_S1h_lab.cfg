\* ls_C_S1h_lab: control: as ls_S1h_lab with LaunchScoped off (the bot kills or types into a launch it never read)
\* b.66h (spec/tla/launch/README.md); base: ci/cfg/ci_S1h_lab.cfg; b.66h knobs overridden at the end of CONSTANTS
SPECIFICATION SplitSpec
CONSTANTS
  MaxSid = 3
  MaxLife = 2
  MaxFaults = 1
  ResumeEnabled = TRUE
  EnableExpire = TRUE
  AllowStray = TRUE
  WallInit = {FALSE, TRUE}
  EnableOrch = FALSE
  EnableBot = TRUE
  EnableSweeper = TRUE
  OrchNames = {"nx"}
  EnableHumanResume = TRUE
  EnableHumanKill = FALSE
  HistoryByLife = TRUE
  ApproverPrompt = FALSE
  Probes = FALSE
  ResumeSendOK = TRUE
  AllowLeftover = FALSE
  EnableCrash = TRUE
  AllowRename = FALSE
  AllowGroup = FALSE
  AllowRespawn = FALSE
  RemainOnExit = FALSE
  AllowLabelFail = TRUE
  AllowRestart = FALSE
  WrongServerFault = FALSE
  CallerWrongServer = FALSE
  AllowLostReply = TRUE
  A1TokenKept = TRUE
  A2ByLabel = TRUE
  A3DollarById = TRUE
  A4LabelRecover = TRUE
  A5PaneKill = TRUE
  A6RecordedSock = TRUE
  A7ProcLiveness = TRUE
  ActPidCheck = TRUE
  Ghosts = TRUE
  HookGate = TRUE
  SpawnScan = TRUE
  StoreInLabel = TRUE
  AllowOtherStore = FALSE
  LeftoverLabelled = TRUE
  LaunchObs <- KnobOn
  LaunchScoped <- KnobOff
  RelaunchAny <- KnobOff
INVARIANT NoOrphan NoOrphanLife OneAgentPerId HandsOff NonGoneInert MarksRightLife ResumeNoEarlierLife NoWrongMemory GetNoEarlierLife SendOnlyCurrentLaunch BotNeverKillsFinished KillFinishedOnlyLeftover KillHonest VerdictSound SidBound ScopedActsOnlyOnObservedLaunch
PROPERTY NoFalseMissing KillPendingOnlyCurrent ChangedIsInert
VIEW CIView
CHECK_DEADLOCK FALSE
