\* ls_Cact: accepted residual, as ci_Cact with the design on: listing and act as separate steps + restart; the compare does not close the pane-id window
\* b.66h (spec/tla/launch/README.md); base: ci/cfg/ci_Cact.cfg; set here: EnableHumanResume (was FALSE); b.66h knobs overridden at the end of CONSTANTS
SPECIFICATION SplitSpec
CONSTANTS
  MaxSid = 3
  MaxLife = 3
  MaxFaults = 1
  ResumeEnabled = TRUE
  EnableExpire = TRUE
  AllowStray = TRUE
  WallInit = {FALSE, TRUE}
  EnableOrch = TRUE
  EnableBot = FALSE
  EnableSweeper = TRUE
  OrchNames = {"nx"}
  EnableHumanResume = TRUE
  EnableHumanKill = TRUE
  HistoryByLife = TRUE
  ApproverPrompt = FALSE
  Probes = FALSE
  ResumeSendOK = TRUE
  AllowLeftover = FALSE
  EnableCrash = TRUE
  AllowRename = FALSE
  AllowGroup = FALSE
  AllowRespawn = FALSE
  RemainOnExit = FALSE
  AllowLabelFail = FALSE
  AllowRestart = TRUE
  WrongServerFault = FALSE
  CallerWrongServer = FALSE
  AllowLostReply = TRUE
  A1TokenKept = TRUE
  A2ByLabel = TRUE
  A3DollarById = TRUE
  A4LabelRecover = TRUE
  A5PaneKill = TRUE
  A6RecordedSock = TRUE
  A7ProcLiveness = TRUE
  ActPidCheck = FALSE
  Ghosts = TRUE
  HookGate = TRUE
  SpawnScan = TRUE
  StoreInLabel = TRUE
  AllowOtherStore = FALSE
  LeftoverLabelled = TRUE
  LaunchObs <- KnobOn
  LaunchScoped <- KnobOn
  RelaunchAny <- KnobOn
INVARIANT NoOrphan NoOrphanLife OneAgentPerId HandsOff NonGoneInert MarksRightLife ResumeNoEarlierLife NoWrongMemory GetNoEarlierLife SendOnlyCurrentLaunch BotNeverKillsFinished KillFinishedOnlyLeftover KillHonest VerdictSound SidBound ScopedActsOnlyOnObservedLaunch
PROPERTY NoFalseMissing KillPendingOnlyCurrent ChangedIsInert
CHECK_DEADLOCK FALSE
