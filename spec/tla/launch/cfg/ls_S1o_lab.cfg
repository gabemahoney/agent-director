\* ls_S1o_lab: design, orchestrator + human kill + human resume of the orchestrator row, 3/3; failed label step; kill scoped
\* b.66h (spec/tla/launch/README.md); base: ci/cfg/ci_S1o_lab.cfg; set here: EnableHumanResume (was FALSE); b.66h knobs overridden at the end of CONSTANTS
SPECIFICATION SplitSpec
CONSTANTS
  MaxSid = 3
  MaxLife = 3
  MaxFaults = 1
  ResumeEnabled = TRUE
  EnableExpire = TRUE
  AllowStray = TRUE
  WallInit = {FALSE, TRUE}
  EnableOrch = TRUE
  EnableBot = FALSE
  EnableSweeper = TRUE
  OrchNames = {"nx"}
  EnableHumanResume = TRUE
  EnableHumanKill = TRUE
  HistoryByLife = TRUE
  ApproverPrompt = FALSE
  Probes = FALSE
  ResumeSendOK = TRUE
  AllowLeftover = FALSE
  EnableCrash = TRUE
  AllowRename = FALSE
  AllowGroup = FALSE
  AllowRespawn = FALSE
  RemainOnExit = FALSE
  AllowLabelFail = TRUE
  AllowRestart = FALSE
  WrongServerFault = FALSE
  CallerWrongServer = FALSE
  AllowLostReply = TRUE
  A1TokenKept = TRUE
  A2ByLabel = TRUE
  A3DollarById = TRUE
  A4LabelRecover = TRUE
  A5PaneKill = TRUE
  A6RecordedSock = TRUE
  A7ProcLiveness = TRUE
  ActPidCheck = TRUE
  Ghosts = TRUE
  HookGate = TRUE
  SpawnScan = TRUE
  StoreInLabel = TRUE
  AllowOtherStore = FALSE
  LeftoverLabelled = TRUE
  LaunchObs <- KnobOn
  LaunchScoped <- KnobOn
  RelaunchAny <- KnobOn
INVARIANT NoOrphan NoOrphanLife OneAgentPerId HandsOff NonGoneInert MarksRightLife ResumeNoEarlierLife NoWrongMemory GetNoEarlierLife SendOnlyCurrentLaunch BotNeverKillsFinished KillFinishedOnlyLeftover KillHonest VerdictSound SidBound ScopedActsOnlyOnObservedLaunch
PROPERTY NoFalseMissing KillPendingOnlyCurrent ChangedIsInert
VIEW CIView
CHECK_DEADLOCK FALSE
