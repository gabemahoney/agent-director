\* rx_safe_rv: Q2 gate: rx_safe + CxReview: the review's unmarked working writes keep WorkingTrue and NoStaleHold
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). The merged relay (Design fixcut, Write cond); b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxTurns = 2
  Subagent = TRUE
  Design = "fixcut"
  Write = "cond"
  Env = {"HookDeath", "BothEndsDie", "SlowIdle", "Claim"}
  Probe = ""
  CxRelay <- KnobOn
  CxReview <- KnobOn
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT WorkingTrue
INVARIANT NoStaleHold
