\* hx_V_pauseended: probe: pause's wait (the fix) writes ended once the agent is gone after its end report
\* b.ssz (tickets/Ideas/b.ssz/tla/README.md). Phase5Hook design values; b.ssz knobs at the end of CONSTANTS.
SPECIFICATION Spec
CONSTANTS
  MaxClock = 5
  MaxLife = 2
  MaxFaults = 1
  PidPool = 3
  Gate = "parent"
  AdoptBy = "adpane"
  KillAll = TRUE
  AllowNested = TRUE
  AllowTeammate = TRUE
  AllowStray = TRUE
  AllowLeftover = TRUE
  AllowRotate = TRUE
  AllowHup = TRUE
  AllowLostReply = TRUE
  AllowNullStart = FALSE
  AllowCrash = TRUE
  Probes = TRUE
  FMNoPaneGone = TRUE
  HookWait = TRUE
  AllowSlowIdentity = FALSE
  Codex <- KnobOn
  PauseOn <- KnobOn
  PauseSeesGone <- KnobOn
INVARIANT NotCxPauseEnded
CHECK_DEADLOCK FALSE
